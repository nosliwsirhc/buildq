[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "buildq"
version = "0.2.0"
description = "A load-aware build queue for one shared Linux machine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
buildq = "buildq.client:main"
buildqd = "buildq.daemon:main"

[tool.setuptools]
script-files = ["bin/buildq-shim", "bin/buildq-rustc-guard"]

[tool.setuptools.data-files]
"share/buildq/skill/buildq" = ["skills/buildq/SKILL.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# High-signal Python security checks (flake8-bandit `S`), ignoring noisy rules for a systems build
# runner that intentionally spawns subprocesses, reads /proc, and uses seeded RNG in benchmarks.
select = ["S"]
ignore = ["S110", "S112", "S311", "S603", "S606", "S607"]

<svg xmlns="http://www.w3.org/2000/svg" width="920" height="408" viewBox="0 0 920 408" role="img" aria-label="buildq CI wait time and memory-spike throughput benchmarks">
  <title>buildq CI wait time and memory-spike throughput benchmarks</title>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .m { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #59636e; }
    .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #656d76; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #59636e; }
  </style>
  <rect x="0.5" y="0.5" width="919" height="407" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="34" class="t" font-size="16" font-weight="700">CI wait time &amp; memory-spike completion time</text>
  <text x="24" y="54" class="m" font-size="12">Lower is better · deterministic replay against the real buildqd daemon</text>
  <rect x="20" y="72" width="466" height="316" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="498" y="72" width="402" height="316" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="36" y="98" class="t" font-size="13" font-weight="600">Median CI wait time (minutes, lower is better)</text>
  <rect x="36" y="107" width="10" height="10" rx="2" fill="#8094aa"/>
  <text x="50" y="116" class="m" font-size="10.5">2 slots</text>
  <rect x="106.0" y="107" width="10" height="10" rx="2" fill="#218bff"/>
  <text x="120.0" y="116" class="m" font-size="10.5">4 slots</text>
  <rect x="176.0" y="107" width="10" height="10" rx="2" fill="#bf8700"/>
  <text x="190.0" y="116" class="m" font-size="10.5">6 slots</text>
  <rect x="246.0" y="107" width="10" height="10" rx="2" fill="#1a7f37"/>
  <text x="260.0" y="116" class="m" font-size="10.5">buildq</text>
  <line x1="146.0" y1="128" x2="146.0" y2="348" stroke="#e5e9ee" stroke-width="1"/>
  <text x="146.0" y="363" text-anchor="middle" class="s" font-size="10">0m</text>
  <line x1="187.0" y1="128" x2="187.0" y2="348" stroke="#e5e9ee" stroke-width="1"/>
  <text x="187.0" y="363" text-anchor="middle" class="s" font-size="10">10m</text>
  <line x1="248.5" y1="128" x2="248.5" y2="348" stroke="#e5e9ee" stroke-width="1"/>
  <text x="248.5" y="363" text-anchor="middle" class="s" font-size="10">25m</text>
  <line x1="351.0" y1="128" x2="351.0" y2="348" stroke="#e5e9ee" stroke-width="1"/>
  <text x="351.0" y="363" text-anchor="middle" class="s" font-size="10">50m</text>
  <text x="136" y="162" text-anchor="end" class="t" font-size="11" font-weight="600">mixed-day</text>
  <text x="136" y="176" text-anchor="end" class="s" font-size="10">(75 builds)</text>
  <rect x="146" y="134" width="205.0" height="11" rx="2.5" fill="#8094aa"/>
  <text x="358.0" y="143.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#bf8700" font-size="10.5" font-weight="500">50.0m (24 T/O)</text>
  <rect x="146" y="149" width="67.7" height="11" rx="2.5" fill="#218bff"/>
  <text x="220.7" y="158.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#59636e" font-size="10.5" font-weight="500">16.5m</text>
  <rect x="146" y="164" width="9.8" height="11" rx="2.5" fill="#bf8700"/>
  <text x="162.8" y="173.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#59636e" font-size="10.5" font-weight="500">2.4m</text>
  <rect x="146" y="179" width="3.0" height="11" rx="2.5" fill="#1a7f37"/>
  <text x="156.0" y="188.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1a7f37" font-size="10.5" font-weight="700">7s (141x vs 4 slots)</text>
  <text x="136" y="233" text-anchor="end" class="t" font-size="11" font-weight="600">ci-behind-agents</text>
  <text x="136" y="247" text-anchor="end" class="s" font-size="10">(12)</text>
  <rect x="146" y="205" width="205.0" height="11" rx="2.5" fill="#8094aa"/>
  <text x="358.0" y="214.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#bf8700" font-size="10.5" font-weight="500">50.0m (5 T/O)</text>
  <rect x="146" y="220" width="140.2" height="11" rx="2.5" fill="#218bff"/>
  <text x="293.2" y="229.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#bf8700" font-size="10.5" font-weight="500">34.2m (3 T/O)</text>
  <rect x="146" y="235" width="169.9" height="11" rx="2.5" fill="#bf8700"/>
  <text x="322.9" y="244.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#bf8700" font-size="10.5" font-weight="500">41.5m (2 T/O)</text>
  <rect x="146" y="250" width="20.0" height="11" rx="2.5" fill="#1a7f37"/>
  <text x="173.0" y="259.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1a7f37" font-size="10.5" font-weight="700">4.9m (0 T/O)</text>
  <text x="136" y="304" text-anchor="end" class="t" font-size="11" font-weight="600">ci-behind-overdue</text>
  <text x="136" y="318" text-anchor="end" class="s" font-size="10">(13)</text>
  <rect x="146" y="276" width="205.0" height="11" rx="2.5" fill="#8094aa"/>
  <text x="358.0" y="285.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#bf8700" font-size="10.5" font-weight="500">50.0m (5 T/O)</text>
  <rect x="146" y="291" width="205.0" height="11" rx="2.5" fill="#218bff"/>
  <text x="358.0" y="300.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#bf8700" font-size="10.5" font-weight="500">50.0m (5 T/O)</text>
  <rect x="146" y="306" width="185.0" height="11" rx="2.5" fill="#bf8700"/>
  <text x="338.0" y="315.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#bf8700" font-size="10.5" font-weight="500">45.1m (2 T/O)</text>
  <rect x="146" y="321" width="46.2" height="11" rx="2.5" fill="#1a7f37"/>
  <text x="199.2" y="330.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1a7f37" font-size="10.5" font-weight="700">11.3m (0 T/O)</text>
  <text x="36" y="379" class="s" font-size="10">No queue omitted: OOM-kills 3/12 and 4/13 builds in ci-behind-*.</text>
  <text x="514" y="98" class="t" font-size="13" font-weight="600">Memory spike: outgrows-estimate (22 builds)</text>
  <text x="514" y="116" class="m" font-size="10.5">Total completion time (minutes) · red = builds OOM-killed</text>
  <line x1="596.0" y1="132" x2="596.0" y2="348" stroke="#e5e9ee" stroke-width="1"/>
  <text x="596.0" y="363" text-anchor="middle" class="s" font-size="10">0m</text>
  <line x1="639.0" y1="132" x2="639.0" y2="348" stroke="#e5e9ee" stroke-width="1"/>
  <text x="639.0" y="363" text-anchor="middle" class="s" font-size="10">35m</text>
  <line x1="682.0" y1="132" x2="682.0" y2="348" stroke="#e5e9ee" stroke-width="1"/>
  <text x="682.0" y="363" text-anchor="middle" class="s" font-size="10">70m</text>
  <line x1="725.0" y1="132" x2="725.0" y2="348" stroke="#e5e9ee" stroke-width="1"/>
  <text x="725.0" y="363" text-anchor="middle" class="s" font-size="10">105m</text>
  <line x1="768.0" y1="132" x2="768.0" y2="348" stroke="#e5e9ee" stroke-width="1"/>
  <text x="768.0" y="363" text-anchor="middle" class="s" font-size="10">140m</text>
  <text x="586" y="159" text-anchor="end" class="t" font-size="11.5" font-weight="500">2 fixed slots</text>
  <rect x="596" y="146" width="160.3" height="18" rx="3" fill="#8094aa"/>
  <text x="764.3" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#59636e" font-size="11" font-weight="500">2.2h (22/22 ok)</text>
  <text x="586" y="199" text-anchor="end" class="t" font-size="11.5" font-weight="500">4 fixed slots</text>
  <rect x="596" y="186" width="86.6" height="18" rx="3" fill="#218bff"/>
  <text x="690.6" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#59636e" font-size="11" font-weight="500">70.5m (22/22 ok)</text>
  <rect x="506" y="219" width="386" height="32" rx="6" fill="#eafbee" stroke="#1a7f37" stroke-opacity="0.45"/>
  <text x="586" y="239" text-anchor="end" class="t" font-size="11.5" font-weight="700">buildq</text>
  <rect x="596" y="226" width="76.2" height="18" rx="3" fill="#1a7f37"/>
  <text x="680.2" y="239" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1a7f37" font-size="11" font-weight="700">62.0m (22/22 ok)</text>
  <text x="586" y="279" text-anchor="end" class="t" font-size="11.5" font-weight="500">6 fixed slots</text>
  <rect x="596" y="266" width="61.4" height="18" rx="3" fill="#cf222e"/>
  <text x="665.4" y="279" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#cf222e" font-size="11" font-weight="500">50.0m (21/22, 1 OOM)</text>
  <text x="586" y="319" text-anchor="end" class="t" font-size="11.5" font-weight="500">No queue</text>
  <rect x="596" y="306" width="30.4" height="18" rx="3" fill="#cf222e" fill-opacity="0.72"/>
  <text x="634.4" y="319" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#cf222e" font-size="11" font-weight="500">24.8m (11/22, 11 OOM)</text>
  <text x="514" y="379" class="s" font-size="10">buildq finishes 12% faster than 4 slots &amp; 2.1x faster than 2 slots.</text>
</svg>

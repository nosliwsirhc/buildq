name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax
        run: python -m py_compile bin/buildq bin/buildqd
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Example config loads
        run: python bin/buildqd --check-config --config config.example.toml

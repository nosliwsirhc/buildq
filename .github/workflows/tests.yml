name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax
        run: python -m py_compile bin/buildq bin/buildqd
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Example config loads
        run: python bin/buildqd --check-config --config config.example.toml

  # The systemd paths (#6): builds as transient services in a slice, their limits, measuring them,
  # pausing them, the slice guard, and make's fifo jobserver. The VM runs systemd; this gives the
  # runner's user a user manager with the controllers delegated, and builds GNU make 4.4 (the
  # image has 4.3, which has no fifo jobserver).
  systemd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: A systemd user session with cpu, io, memory and pids delegated
        run: |
          sudo mkdir -p /etc/systemd/system/user@.service.d
          printf '[Service]\nDelegate=cpu cpuset io memory pids\n' | sudo tee /etc/systemd/system/user@.service.d/delegate.conf
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          for _ in $(seq 1 60); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          [ -S "/run/user/$uid/bus" ] || { echo "::error::no user bus after 60 s: user@$uid.service didn't start"; exit 1; }
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
      - name: Check the session
        run: |
          systemctl --user show-environment >/dev/null
          systemd-run --user --scope --quiet true
          cat "/sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service/cgroup.controllers"
      - name: GNU make 4.4
        shell: bash  # (-eo pipefail: any failing command fails the step)
        run: |
          mkdir -p "$RUNNER_TEMP/make"
          cd "$RUNNER_TEMP/make"
          curl -fsSL --retry 3 -o make.tar.gz https://ftp.gnu.org/gnu/make/make-4.4.1.tar.gz ||
            curl -fsSL --retry 3 -o make.tar.gz https://ftpmirror.gnu.org/make/make-4.4.1.tar.gz
          echo "dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3  make.tar.gz" | sha256sum -c -
          tar xzf make.tar.gz
          cd make-4.4.1
          ./configure --prefix="$HOME/.local" --disable-nls >/dev/null
          ./build.sh >/dev/null
          ./make install >/dev/null
          "$HOME/.local/bin/make" --version | head -1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Tests, with builds as systemd services
        shell: bash  # (-eo pipefail: a failing suite fails the step through tee)
        env:
          BUILDQ_TEST_SCOPES: "1"
        run: |
          make --version | head -1
          python3 --version
          python3 -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: The systemd and jobserver tests ran, not skipped
        run: |
          if grep -E "^test_.*\((test_end_to_end\.)?ScopeTests[^)]*\).* skipped|test_make_follows_its_jobserver.* skipped" "$RUNNER_TEMP/tests.log"; then
            echo "::error::the systemd paths weren't exercised"; exit 1
          fi
          # nothing in the whole suite skipped here: the summary is a bare OK
          grep -qE "^OK$" "$RUNNER_TEMP/tests.log" || { echo "::error::some tests were skipped or failed"; grep -E "^(OK|FAILED)" "$RUNNER_TEMP/tests.log"; exit 1; }
          echo "ScopeTests passed: $(grep -cE 'ScopeTests[^)]*\) \.\.\. ok$' "$RUNNER_TEMP/tests.log")"
      - name: Example config loads, with systemd checking its lane properties
        run: python3 bin/buildqd --check-config --config config.example.toml


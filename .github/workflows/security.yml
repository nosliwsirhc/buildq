name: security

# Free, fork-PR-safe security & shell-portability checks (no secrets or cloud tokens required).
# Runs alongside GitHub's built-in CodeQL (Python + Actions) and Secret Scanning.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: ShellCheck & POSIX sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify POSIX /bin/sh syntax with dash
        run: |
          dash -n \
            install.sh \
            bin/buildq-rustc-guard \
            init/cgroup-setup.sh \
            init/runit/buildqd/run \
            init/runit/buildqd/log/run \
            init/s6/buildqd/run \
            init/s6/buildqd/log/run \
            init/sysvinit/buildqd
      - name: Run ShellCheck (-s sh)
        run: |
          shellcheck -s sh -S warning \
            install.sh \
            bin/buildq-rustc-guard \
            init/cgroup-setup.sh \
            init/runit/buildqd/run \
            init/runit/buildqd/log/run \
            init/s6/buildqd/run \
            init/s6/buildqd/log/run \
            init/sysvinit/buildqd

  python-security:
    name: Ruff security & Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Ruff and Semgrep
        run: python -m pip install --disable-pip-version-check --no-input ruff semgrep
      - name: Ruff security checks (S)
        run: ruff check src/ bin/ bench/
      - name: Semgrep OSS security audit
        run: semgrep scan --config p/python --config p/security-audit --error --metrics=off src/ bin/ bench/

  secrets:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks (verified checksum)
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -fsSL --retry 3 -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan repository history for secrets
        run: gitleaks git --redact --verbose

  workflows:
    name: Workflow security (actionlint & zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install actionlint (verified checksum) and zizmor
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          curl -fsSL --retry 3 -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
          python -m pip install --disable-pip-version-check --no-input zizmor
      - name: Lint workflows with actionlint
        run: actionlint
      - name: Audit workflows with zizmor
        run: zizmor --persona regular .github/workflows/
